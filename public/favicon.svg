  <!-- Dark Background Squircle -->
  <rect width="64" height="64" rx="16" fill="#0D0F17" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#borderGlow)" stroke-width="1.5" />

