services:
  - type: web
    name: cloudguard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: FRONTEND_URL
        value: https://c-g-ecru.vercel.app
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: adarshhegde024@gmail.com
      - key: SMTP_PASSWORD
        value: zgaofhgyrittrdrs
      - key: SMTP_FROM_EMAIL
        value: adarshhegde024@gmail.com
      - key: SMTP_FROM_NAME
        value: CloudGuard Security
      - key: SMTP_USE_TLS
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://c-g-ecru.vercel.app,http://localhost:5173,http://localhost:8080,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:8080
